name: 🐞 Баг / Bug report
description: Что-то работает не так / Something doesn't work as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Спасибо, что сообщаете о проблеме! Об уязвимостях — **не здесь**, а приватно: см. SECURITY.md.
        Thanks for reporting! For security issues use private reporting instead (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: Что случилось / What happened
      description: Кратко опишите проблему.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Как воспроизвести / Steps to reproduce
      placeholder: |
        1. Открыть …
        2. Нажать …
        3. Увидеть …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Что ожидалось / Expected behavior
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Платформа / Platform
      multiple: true
      options:
        - Android
        - iOS / iPadOS
        - macOS
        - Windows
        - Linux
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Версия приложения и ОС / App and OS version
      placeholder: "Pixroost 1.0.0, iOS 26.1, iPhone 15"
  - type: dropdown
    id: source
    attributes:
      label: Затронутый источник / Affected source
      multiple: true
      options:
        - Галерея / Gallery
        - Яндекс Диск / Yandex Disk
        - Dropbox
        - OneDrive
        - Google Photos / Takeout
        - WebDAV
        - Папка на ПК / Local folder
        - Передача на ПК / Transfer to PC
        - Не относится / N/A
  - type: textarea
    id: logs
    attributes:
      label: Журнал и скриншоты / Logs and screenshots
      description: Настройки → Экспорт журнала. Уберите личные данные перед публикацией.
