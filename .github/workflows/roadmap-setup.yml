name: Roadmap setup

# Attaches labels and milestones to the roadmap epics (#1–#8).
# Milestones are created by hand; an epic goes to the milestone whose title starts with its version
# (e.g. "v0.1 — Ядро и лента"). Nothing is created or removed.
# Runs after the "Labels" workflow has synced labels on main, or manually.
# Safe to re-run: labels are only added, and an epic that already has a milestone is not moved.

on:
  workflow_run:
    workflows: [Labels]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  link-epics:
    name: Link epics
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
    steps:
      - name: Attach labels and milestones to epics
        run: |
          set -euo pipefail
          milestones="$(gh api "repos/$REPO/milestones?state=all&per_page=100" --jq '.[].title')"

          # Prints the title of the milestone that starts with the given version, if any.
          find_milestone() {
            local re="^${1//./\\.}([^0-9.]|\$)"
            while IFS= read -r title; do
              if [[ -n "$title" && $title =~ $re ]]; then
                printf '%s\n' "$title"
                return 0
              fi
            done <<<"$milestones"
            return 0
          }

          while IFS='|' read -r issue version labels; do
            gh issue edit "$issue" --repo "$REPO" --add-label "$labels"
            current="$(gh issue view "$issue" --repo "$REPO" --json milestone --jq '.milestone.title // ""')"
            if [ -n "$current" ]; then
              echo "#$issue: labels [$labels], milestone kept: $current"
              continue
            fi
            target="$(find_milestone "$version")"
            if [ -z "$target" ]; then
              echo "::warning::#$issue: no milestone starting with $version — create it and re-run"
              continue
            fi
            gh issue edit "$issue" --repo "$REPO" --milestone "$target"
            echo "#$issue: labels [$labels], milestone: $target"
          done <<'EOF'
          1|v0.1|epic
          2|v0.1|epic,spike
          3|v0.1|epic,design
          4|v0.1|epic,area:ui
          5|v0.2|epic,area:transfer
          6|v0.3|epic,area:sources
          7|v0.4|epic,area:dedupe
          8|v1.0|epic
          EOF
