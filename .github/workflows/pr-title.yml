name: PR title

# Checks that the PR title follows Conventional Commits.
# With squash merges the PR title becomes the commit message on main.
# See docs/process/conventions.md

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  conventional-title:
    name: Conventional Commits
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            design
            test
            build
            ci
            chore
            revert
          requireScope: false
          # Dependabot capitalizes its titles ("ci: Bump the actions group ..."), everyone else starts lowercase.
          subjectPattern: ${{ github.event.pull_request.user.login == 'dependabot[bot]' && '^.+$' || '^(?![A-Z]).+$' }}
          subjectPatternError: |
            The subject "{subject}" in PR title "{title}" must start with a lowercase letter.
            Example: "feat(devices): add QR pairing screen". See docs/process/conventions.md
