[versions]
kotlin = "2.4.20"
# Not newer than the latest stable Android Studio supports: Quail 2 and 3 support AGP up to 9.3.
# https://developer.android.com/build/releases/about-agp. Dependabot proposes only patch updates for it.
agp = "9.3.3"
composeMultiplatform = "1.12.1"
composeMaterial3 = "1.9.0"
androidxActivity = "1.13.0"
# Spike S-02 only.
coil = "3.6.3"
androidxMetrics = "1.0.0"

# Code quality: docs/process/conventions.md#проверки-кода
spotless = "8.10.2"
ktlint = "1.8.0"
# Compose API guidelines as ktlint rules: https://mrmans0n.github.io/compose-rules/
composeRules = "0.6.7"
# 2.0 is the line built on Kotlin 2.4; 1.23 is built on Kotlin 2.0 and cannot parse newer syntax.
detekt = "2.0.0-alpha.6"
kover = "0.9.9"

# Android SDK levels, read by the convention plugins in build-logic.
androidCompileSdk = "37"
androidTargetSdk = "37"
androidMinSdk = "26"

[libraries]
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "composeMultiplatform" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "composeMultiplatform" }
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "composeMultiplatform" }
compose-ui-tooling-preview = { module = "org.jetbrains.compose.ui:ui-tooling-preview", version.ref = "composeMultiplatform" }
compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "composeMaterial3" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidxActivity" }
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
coil-video = { module = "io.coil-kt.coil3:coil-video", version.ref = "coil" }
androidx-metrics-performance = { module = "androidx.metrics:metrics-performance", version.ref = "androidxMetrics" }

# Gradle plugins used by build-logic.
android-gradlePlugin = { module = "com.android.tools.build:gradle", version.ref = "agp" }
kotlin-gradlePlugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
compose-gradlePlugin = { module = "org.jetbrains.compose:compose-gradle-plugin", version.ref = "composeMultiplatform" }
compose-compiler-gradlePlugin = { module = "org.jetbrains.kotlin:compose-compiler-gradle-plugin", version.ref = "kotlin" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-kmp-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
detekt = { id = "dev.detekt", version.ref = "detekt" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }

# Convention plugins from build-logic.
pixroost-kmp-library = { id = "pixroost.kmp.library" }
pixroost-compose = { id = "pixroost.compose" }
pixroost-android-application = { id = "pixroost.android.application" }
pixroost-desktop-application = { id = "pixroost.desktop.application" }
